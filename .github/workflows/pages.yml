name: Deploy to GitHub Pages

# One branch, and it has to be the repository's default one.
#
# The `github-pages` environment carries a deployment branch rule that admits the
# default branch and nothing else, so a run from anywhere else builds, uploads its
# artifact, and is then turned away at the deploy step with `Branch "…" is not
# allowed to deploy to github-pages`. Listing two branches also had them racing:
# both fired on one push, and the cancellation below killed the run that was
# allowed to deploy in favour of the one that wasn't.
#
# The default branch here is dark-theme-3d-blossoms — it was the first branch
# pushed to an empty repository, which is what GitHub takes the default from.
# main now points at the same commit, so if the default is ever moved to main,
# change this line with it.
on:
  push:
    branches: [dark-theme-3d-blossoms]
  workflow_dispatch:

# pages + id-token are what deploy-pages needs to mint its OIDC token; contents
# stays read because nothing here writes back to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# Queue rather than cancel. A deploy is not a check that can be safely abandoned
# half-way: cancelling one to start another is how run #4 was lost, and letting
# them finish in order costs only the wait.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm before setup-node, or `cache: pnpm` has no pnpm to ask for a store
      # path and the run fails before installing anything. Version is pinned
      # explicitly because package.json carries no `packageManager` field, and
      # pnpm/action-setup errors out rather than guessing; 10 matches the
      # lockfileVersion 9.0 in pnpm-lock.yaml.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm build` is `tsc && vite build` — the type check gates the deploy,
      # which is deliberate: a broken build should fail here rather than publish
      # a blank page.
      - run: pnpm build

      # No `enablement: true`. It was here to try to turn Pages on without an
      # admin, and it is what failed run #1: creating a Pages site is not
      # something GITHUB_TOKEN may do in this organisation, so the step died on
      # `Resource not accessible by integration` before anything was uploaded.
      # The site now exists — enabled by hand, source set to GitHub Actions — so
      # this only has to read its settings to learn the base URL.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
